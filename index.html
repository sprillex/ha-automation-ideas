<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA Community Automation Suggester & Discovery Directory</title>
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f3f4f6;
      --accent: #38bdf8;
      --border: #374151;
      --button-bg: #0284c7;
      --button-hover: #0369a1;
      --secondary-text: #9ca3af;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--secondary-text); font-size: 0.95rem; }

    .search-bar {
      margin: 15px 0 10px 0;
    }
    .search-bar input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    .search-bar input:focus {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0 25px 0;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .filters label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .card h3 { margin: 0 0 6px 0; font-size: 1.05rem; }
    .card p { margin: 0; font-size: 0.85rem; line-height: 1.4; color: #d1d5db; }
    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      width: fit-content;
    }
    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-repo {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #ffffff;
      background: var(--button-bg);
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-repo:hover {
      background: var(--button-hover);
    }
    .link-file {
      font-size: 0.78rem;
      color: var(--secondary-text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .link-file:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-action {
      margin-top: 30px;
      text-align: center;
      padding: 15px;
      border-top: 1px solid var(--border);
    }
    .footer-action a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Community Automation Discovery Directory</h1>
  <p>Select your installed device hardware or search by keyword to discover upstream automation repositories:</p>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search automation ideas by title or keyword..." oninput="render()">
  </div>

  <div class="filters">
    <label><input type="checkbox" id="f-motion" checked onchange="render()"> Motion</label>
    <label><input type="checkbox" id="f-light" checked onchange="render()"> Light</label>
    <label><input type="checkbox" id="f-door" checked onchange="render()"> Door / Contact</label>
    <label><input type="checkbox" id="f-switch" checked onchange="render()"> Switch / Plug</label>
    <label><input type="checkbox" id="f-media" checked onchange="render()"> Media Player</label>
    <label><input type="checkbox" id="f-climate" checked onchange="render()"> Climate / AC</label>
    <label><input type="checkbox" id="f-lock" checked onchange="render()"> Smart Lock</label>
    <label><input type="checkbox" id="f-cover" checked onchange="render()"> Cover / Blinds</label>
    <label><input type="checkbox" id="f-power" checked onchange="render()"> Power Monitor</label>
    <label><input type="checkbox" id="f-presence" checked onchange="render()"> Presence / Person</label>
    <label><input type="checkbox" id="f-sun" checked onchange="render()"> Sun Sensor</label>
  </div>

  <div class="grid" id="recipes-grid"></div>

  <div class="footer-action">
    Have an automation idea or repository to feature? <a href="https://github.com/sprillex/ha-automation-ideas/edit/main/recipes.json" target="_blank">+ Add it to recipes.json on GitHub</a>
  </div>
</div>

<script>
let allRecipes = [];

function deriveRepoUrl(item) {
  if (item.repo_url) return item.repo_url;
  if (item.github_url) {
    const match = item.github_url.match(/https:\/\/github\.com\/[^\/]+\/[^\/]+/);
    if (match) return match[0];
  }
  return "https://github.com/sprillex/ha-automation-ideas";
}

function getFileUrl(item) {
  if (item.github_url) return item.github_url;
  if (item.repo_url) return item.repo_url;
  return "https://github.com/sprillex/ha-automation-ideas/blob/main/recipes.json";
}

async function loadRecipes() {
  try {
    const res = await fetch('recipes.json');
    allRecipes = await res.json();
    render();
  } catch (err) {
    document.getElementById('recipes-grid').innerHTML = '<p>Could not load recipes catalog.</p>';
  }
}

function render() {
  const query = document.getElementById('search-input').value.toLowerCase().trim();

  const hardware = {
    motion: document.getElementById('f-motion').checked,
    light: document.getElementById('f-light').checked,
    door: document.getElementById('f-door').checked,
    switch: document.getElementById('f-switch').checked,
    media: document.getElementById('f-media').checked,
    climate: document.getElementById('f-climate').checked,
    lock: document.getElementById('f-lock').checked,
    cover: document.getElementById('f-cover').checked,
    power: document.getElementById('f-power').checked,
    presence: document.getElementById('f-presence').checked,
    sun: document.getElementById('f-sun').checked
  };

  const grid = document.getElementById('recipes-grid');
  grid.innerHTML = '';

  const matched = allRecipes.filter(r => {
    const req = r.requires || r.category || [];
    const matchesHardware = req.every(tag => hardware[tag]);
    const matchesQuery = !query ||
      (r.title && r.title.toLowerCase().includes(query)) ||
      (r.desc && r.desc.toLowerCase().includes(query)) ||
      (r.name && r.name.toLowerCase().includes(query)) ||
      (r.description && r.description.toLowerCase().includes(query));

    return matchesHardware && matchesQuery;
  });

  if (matched.length === 0) {
    grid.innerHTML = '<p>No matching automation recipes found for your current filter and search.</p>';
    return;
  }

  matched.forEach(item => {
    const title = item.title || item.name;
    const desc = item.desc || item.description;
    const req = item.requires || item.category || [];
    const repoUrl = deriveRepoUrl(item);
    const fileUrl = getFileUrl(item);

    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div>
        <h3>${title}</h3>
        <p>${desc}</p>
      </div>
      <div class="card-footer">
        <div class="badge-row">
          <span class="badge">${req.join(' + ')}</span>
        </div>
        <div class="actions-row">
          <a href="${repoUrl}" target="_blank" class="btn-repo">View Repository</a>
          <a href="${fileUrl}" target="_blank" class="link-file">View Blueprint File</a>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });
}

loadRecipes();
</script>
</body>
</html>
