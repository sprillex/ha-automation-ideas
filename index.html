<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA Local Automation Suggester</title>
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f3f4f6;
      --accent: #38bdf8;
      --border: #374151;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: #9ca3af; font-size: 0.95rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0 25px 0;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .filters label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { margin: 0 0 8px 0; font-size: 1.05rem; }
    .card p { margin: 0; font-size: 0.85rem; line-height: 1.4; }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      width: fit-content;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Local Automation Explorer</h1>
  <p>Select the devices you have installed to filter compatible automations:</p>

  <div class="filters">
    <label><input type="checkbox" id="f-motion" checked onchange="render()"> Motion Sensor</label>
    <label><input type="checkbox" id="f-light" checked onchange="render()"> Smart Lights</label>
    <label><input type="checkbox" id="f-door" checked onchange="render()"> Door / Contact</label>
    <label><input type="checkbox" id="f-switch" checked onchange="render()"> Smart Switch/Plug</label>
    <label><input type="checkbox" id="f-media" checked onchange="render()"> Media Player</label>
    <label><input type="checkbox" id="f-climate" checked onchange="render()"> Thermostat</label>
    <label><input type="checkbox" id="f-lock" checked onchange="render()"> Smart Lock</label>
  </div>

  <div class="grid" id="recipes-grid"></div>
</div>

<script>
const recipes = [
  { title: "Motion Hallway Light", req: ["motion", "light"], desc: "Turn on hallway light on movement, turn off after 3 min vacancy." },
  { title: "Midnight Nightlight", req: ["motion", "light"], desc: "Motion between 11 PM and 6 AM dims path lighting to 10%." },
  { title: "Open Door HVAC Cutoff", req: ["door", "climate"], desc: "If patio door is open > 3 minutes, pause AC/Heating." },
  { title: "Movie Dimming Mode", req: ["media", "light"], desc: "Dim living room lamps to 20% when TV begins playing media." },
  { title: "Pantry Door Light", req: ["door", "light"], desc: "Turn on light when pantry door opens; shut off on door close." },
  { title: "Nightly Security Check", req: ["lock", "door"], desc: "Audit locks and alert if exterior doors are unlatched at 11 PM." },
  { title: "Closet Auto-Light", req: ["door", "light"], desc: "Instant light when closet opens, turning off immediately on close." },
  { title: "Desk Follows PC Power", req: ["switch", "light"], desc: "Turn on bias backlights when PC drawing over 25W." },
  { title: "Arrival Porch Light", req: ["door", "light"], desc: "Exterior porch lights illuminate upon door unlock after dusk." },
  { title: "Media Pause Accent Light", req: ["media", "light"], desc: "Bring ambient lighting to 40% when TV pauses." }
];

function render() {
  const motion = document.getElementById('f-motion').checked;
  const light = document.getElementById('f-light').checked;
  const door = document.getElementById('f-door').checked;
  const sw = document.getElementById('f-switch').checked;
  const media = document.getElementById('f-media').checked;
  const climate = document.getElementById('f-climate').checked;
  const lock = document.getElementById('f-lock').checked;

  const userHardware = { motion, light, door, switch: sw, media, climate, lock };

  const grid = document.getElementById('recipes-grid');
  grid.innerHTML = '';

  const matched = recipes.filter(r => r.req.every(item => userHardware[item]));

  if (matched.length === 0) {
    grid.innerHTML = '<p>No matching recipes found for the selected device types.</p>';
    return;
  }

  matched.forEach(item => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
      <span class="badge">${item.req.join(' + ')}</span>
    `;
    grid.appendChild(el);
  });
}

render();
</script>
</body>
</html>
