<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA Community Automation Suggester</title>
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f3f4f6;
      --accent: #38bdf8;
      --border: #374151;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: #9ca3af; font-size: 0.95rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0 25px 0;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .filters label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { margin: 0 0 8px 0; font-size: 1.05rem; }
    .card p { margin: 0; font-size: 0.85rem; line-height: 1.4; color: #d1d5db; }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      width: fit-content;
    }
    .footer-action {
      margin-top: 30px;
      text-align: center;
      padding: 15px;
      border-top: 1px solid var(--border);
    }
    .footer-action a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Community Automation Explorer</h1>
  <p>Select your active devices to discover compatible automation ideas:</p>

  <div class="filters">
    <label><input type="checkbox" id="f-motion" checked onchange="render()"> Motion</label>
    <label><input type="checkbox" id="f-light" checked onchange="render()"> Light</label>
    <label><input type="checkbox" id="f-door" checked onchange="render()"> Door / Contact</label>
    <label><input type="checkbox" id="f-switch" checked onchange="render()"> Switch / Plug</label>
    <label><input type="checkbox" id="f-media" checked onchange="render()"> Media Player</label>
    <label><input type="checkbox" id="f-climate" checked onchange="render()"> Climate / AC</label>
    <label><input type="checkbox" id="f-lock" checked onchange="render()"> Smart Lock</label>
    <label><input type="checkbox" id="f-cover" checked onchange="render()"> Cover / Blinds</label>
    <label><input type="checkbox" id="f-power" checked onchange="render()"> Power Monitor</label>
    <label><input type="checkbox" id="f-presence" checked onchange="render()"> Presence / Person</label>
    <label><input type="checkbox" id="f-sun" checked onchange="render()"> Sun Sensor</label>
  </div>

  <div class="grid" id="recipes-grid"></div>

  <div class="footer-action">
    Have an automation idea? <a href="https://github.com/sprillex/ha-automation-ideas/edit/main/recipes.json" target="_blank">+ Add it to recipes.json on GitHub</a>
  </div>
</div>

<script>
let allRecipes = [];

async function loadRecipes() {
  try {
    const res = await fetch('recipes.json');
    allRecipes = await res.json();
    render();
  } catch (err) {
    document.getElementById('recipes-grid').innerHTML = '<p>Could not load recipes catalog.</p>';
  }
}

function render() {
  const hardware = {
    motion: document.getElementById('f-motion').checked,
    light: document.getElementById('f-light').checked,
    door: document.getElementById('f-door').checked,
    switch: document.getElementById('f-switch').checked,
    media: document.getElementById('f-media').checked,
    climate: document.getElementById('f-climate').checked,
    lock: document.getElementById('f-lock').checked,
    cover: document.getElementById('f-cover').checked,
    power: document.getElementById('f-power').checked,
    presence: document.getElementById('f-presence').checked,
    sun: document.getElementById('f-sun').checked
  };

  const grid = document.getElementById('recipes-grid');
  grid.innerHTML = '';

  const matched = allRecipes.filter(r => r.requires.every(req => hardware[req]));

  if (matched.length === 0) {
    grid.innerHTML = '<p>No matching recipes found for the selected device types.</p>';
    return;
  }

  matched.forEach(item => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
      <span class="badge">${item.requires.join(' + ')}</span>
    `;
    grid.appendChild(el);
  });
}

loadRecipes();
</script>
</body>
</html>
